# Deployment stack (production-shaped): API + static web + reverse proxy.
# This is intentionally separate from compose.yaml (local dev: postgres+minio).
# Usage: docker compose -f compose.deploy.yml up -d
#
# BEFORE DEPLOY (docs/security.md §secret-replacement): rotate every secret that
# ever appeared in prompts/chat — Brevo SMTP key, B2 application key, Neon
# password. Never copy old values here or into the repo.

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: .env            # production values; TRUSTED_ORIGINS must list the public origin
    environment:
      NODE_ENV: production
      ROSETTA_DATA_DIR: /data/corpus
    volumes:
      - corpus:/data/corpus    # Rosetta sqlite corpus (WAL) — volume, not image
    expose:
      - "3001"
    # Docker HEALTHCHECK (Dockerfile) gates readiness; the proxy below only
    # forwards to healthy targets.
    stop_grace_period: 20s    # give SIGTERM shutdown (supervisor children) time

  web:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./apps/web/dist:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  corpus:
