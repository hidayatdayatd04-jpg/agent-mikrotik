# Reverse proxy: serve the SPA, proxy /api to the Bun backend.
# SSE requirements: buffering off, long read timeout, HTTP/1.1 upstream.
server {
  listen 80;
  server_name _;

  # Static SPA (built with `bun run build` → apps/web/dist)
  root /usr/share/nginx/html;
  index index.html;

  # Security headers (no inline scripts needed; Vite hashes assets)
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # API + SSE: no buffering so message.delta streams immediately.
  location /api/ {
    proxy_pass http://api:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # SSE: disable buffering, extend timeouts past heartbeat interval
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    # uploads up to 10 MiB + multipart overhead
    client_max_body_size 12m;
  }

  # SPA fallback for client-side routes
  location / {
    try_files $uri $uri/ /index.html;
  }
}
